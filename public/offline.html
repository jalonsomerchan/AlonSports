<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10130f" />
    <title>Alon Sports · Sin conexión</title>
    <style>
      :root { color-scheme: dark; --bg:#10130f; --panel:#181c16; --lime:#c9f45b; --muted:#8c9386; }
      * { box-sizing: border-box; }
      body { min-height:100dvh; margin:0; display:grid; place-items:center; padding:28px; color:#f0f2eb; background:radial-gradient(circle at 50% 30%, #26351a 0, var(--bg) 52%); font:15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; text-align:center; }
      main { width:min(100%, 360px); padding:32px 24px; border:1px solid rgba(255,255,255,.08); border-radius:24px; background:rgba(24,28,22,.9); box-shadow:0 20px 70px rgba(0,0,0,.3); }
      img { width:128px; height:128px; object-fit:contain; margin-bottom:18px; }
      h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.06em; }
      p { margin:0; color:var(--muted); }
      button { margin-top:24px; border:0; border-radius:12px; padding:12px 18px; color:#18200e; background:var(--lime); font-weight:800; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Alon Sports" />
      <h1>Estás sin conexión</h1>
      <p>Alon Sports volverá a sincronizarse cuando recuperes internet.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
